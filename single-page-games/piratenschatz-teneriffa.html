@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.app {
  font-family: 'Fredoka', 'Comic Sans MS', system-ui, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #0E4C63 0%, #1B7FA6 45%, #2D9BC4 100%);
  color: #2B2118;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px; user-select: none;
}
.frame { width: 100%; max-width: 480px; }
.card {
  background: #FFF7E0; border-radius: 18px; padding: 16px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.18);
  margin-bottom: 12px;
}
h1, h2, h3 { margin: 0 0 8px 0; }
.title-big { font-size: 30px; font-weight: 700; color: #FFF7E0; text-align: center;
  text-shadow: 0 3px 0 rgba(0,0,0,0.3); line-height: 1.15; }
.subtitle { color: #F2C14E; text-align: center; font-weight: 600; margin: 6px 0 14px; }
.btn {
  font-family: inherit; font-size: 19px; font-weight: 600;
  background: #F58B3C; color: #fff; border: none; border-radius: 14px;
  padding: 14px 22px; box-shadow: 0 4px 0 #B05A1A; cursor: pointer;
  width: 100%; margin-top: 8px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #B05A1A; }
.btn.green { background: #2E8B57; box-shadow: 0 4px 0 #1C5936; }
.btn.green:active { box-shadow: 0 1px 0 #1C5936; }
.btn.ghost { background: #FFF7E0; color: #7A5C2E; box-shadow: 0 4px 0 #D8C79A; }
.btn.ghost:active { box-shadow: 0 1px 0 #D8C79A; }
.btn.small { width: auto; font-size: 15px; padding: 9px 14px; margin-top: 0; }
.story { font-size: 17px; line-height: 1.45; }
.speaker { font-weight: 700; color: #B05A1A; }
.cipherbox {
  background: #2B2118; color: #F2C14E; border-radius: 12px;
  padding: 14px; text-align: center; font-size: 24px; font-weight: 600;
  letter-spacing: 3px; margin: 10px 0; line-height: 1.7; word-break: break-word;
  border: 3px dashed #F2C14E;
}
.question { font-size: 16px; font-weight: 600; margin: 8px 0; }
.answerrow { display: flex; gap: 8px; margin-top: 8px; }
.answerrow input {
  flex: 1; font-family: inherit; font-size: 20px; font-weight: 600;
  padding: 12px; border-radius: 12px; border: 3px solid #D8C79A;
  background: #fff; text-transform: uppercase; min-width: 0;
}
.answerrow input:focus { outline: 3px solid #F58B3C; border-color: #F58B3C; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
.chip {
  background: #FBEBC6; border: 2px solid #E3CD93; border-radius: 10px;
  padding: 4px 8px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.chip.big { font-size: 17px; padding: 6px 10px; }
.hintbox {
  background: #E8F4EA; border: 2px solid #9CCBA8; border-radius: 12px;
  padding: 10px 12px; font-size: 15px; margin-top: 10px;
}
.wrongmsg { color: #C0392B; font-weight: 600; margin-top: 8px; font-size: 15px; animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
@keyframes pop { 0%{transform:scale(0.4);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.gridtable { border-collapse: collapse; margin: 8px auto; }
.gridtable td, .gridtable th {
  border: 2px solid #C9A94E; width: 36px; height: 36px; text-align: center;
  font-size: 16px; font-weight: 700; background: #FBEBC6;
}
.gridtable th { background: #F2C14E; color: #2B2118; }
.hud {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,247,224,0.95); border-radius: 14px; padding: 8px 12px;
  margin-bottom: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}
.hudtitle { font-weight: 700; font-size: 15px; }
.digitchips { display: flex; gap: 5px; }
.digitcoin {
  width: 30px; height: 30px; border-radius: 50%; background: #F2C14E;
  border: 2px solid #B08A1E; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; color: #6B4E00;
}
.digitcoin.empty { background: #E7DDC2; border-color: #C7BB9C; color: #B3A784; }
.mapwrap { position: relative; width: 100%; border-radius: 18px; overflow: hidden;
  box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
.node { cursor: pointer; }
.node.locked { cursor: default; }
.node-current circle.ring { animation: pulse 1.4s infinite; transform-origin: center; transform-box: fill-box; }
.avatar { transition: transform 1s ease-in-out; }
.overlay {
  position: fixed; inset: 0; background: rgba(14,44,60,0.75); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 18px;
}
.overlay .card { animation: pop .35s ease-out; max-width: 420px; width: 100%; }
.bigemoji { font-size: 56px; text-align: center; animation: bounce 1.2s infinite; }
.padrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.padbtn {
  width: 62px; height: 62px; border-radius: 14px; border: none;
  font-size: 24px; font-weight: 700; font-family: inherit;
  background: #FBEBC6; box-shadow: 0 4px 0 #C9A94E; cursor: pointer;
}
.padbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #C9A94E; }
.lockslots { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
.lockslot {
  width: 52px; height: 62px; border-radius: 12px; background: #2B2118;
  color: #F2C14E; font-size: 32px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid #C9A94E;
}
.ctrls { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; }
.ctrlbtn {
  flex: 1; height: 64px; border-radius: 16px; border: none; font-size: 28px;
  background: #FFF7E0; box-shadow: 0 5px 0 rgba(0,0,0,0.25);
  touch-action: none; font-family: inherit; font-weight: 700;
}
.ctrlbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
.ctrlbtn.jump { background: #F58B3C; color: #fff; flex: 1.4; }
.slots { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.slot {
  width: 36px; height: 42px; border-radius: 8px; background: #FFF7E0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #B05A1A;
  box-shadow: 0 3px 0 rgba(0,0,0,0.2);
}
.foundlist { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; justify-content: center; }
.founditem {
  background: #FFF7E0; border-radius: 10px; padding: 4px 9px; font-size: 15px;
  font-weight: 600; border: 2px solid #E3CD93;
}
.founditem.done { background: #C9EAD1; border-color: #2E8B57; text-decoration: line-through; }
.confetti-piece {
  position: fixed; top: -20px; width: 12px; height: 12px; z-index: 60;
  animation: fall linear forwards; border-radius: 3px;
}
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) {
  .node-current circle.ring, .bigemoji, .avatar { animation: none; transition: none; }
}

,emoji:"\u2693",x:105,y:210,type:"hidden",scene:Vy,digit:"5",story:"Am Hafen wimmelt es von Booten und Kisten. Ein alter Fischer erz\xE4hlt: \u201EBarbanegra hat hier f\xFCnf Dinge versteckt. Wer alle findet, dem zeigt sich der n\xE4chste Hinweis!\u201C Tippt die 5 versteckten Sachen im Bild an!",successText:"Alle gefunden! In der Flaschenpost steckt eine goldene M\xFCnze mit einer Ziffer darauf \u2013 und ein Zettel: \u201EWeiter zur wilden Masca-Schlucht!\u201C"},{id:"masca",name:"Masca-Schlucht",emoji:"\u26F0\uFE0F",x:75,y:175,type:"game",game:Qy,story:"Die Masca-Schlucht ist wild und felsig! Laurent ruft: \u201EDa vorne glitzern Goldm\xFCnzen mit Buchstaben drauf!\u201C Springt \xFCber die Felsen, sammelt alle 5 M\xFCnzen ein und lauft bis zur Piratenflagge. Die Buchstaben ergeben ein Wort!",successText:"Die M\xFCnzen ergeben das Wort KARTE! Laurent jubelt: \u201EBeim Drachenbaum soll ein St\xFCck der Schatzkarte versteckt sein \u2013 los!\u201C"},{id:"drachenbaum",name:"Drachenbaum von Icod",emoji:"\u{1F333}",x:105,y:130,type:"cipher",digit:"2",story:"Der uralte Drachenbaum ist \xFCber 800 Jahre alt! In seiner Rinde ist eine Botschaft aus geheimen Zeichen eingeritzt. Zum Gl\xFCck liegt daneben ein Stein mit der Zeichen-Tabelle.",cipher:{mode:"symbol",display:"\u{1F334} \u2693 \u{1F99C} \u2600\uFE0F \u{1F5DD}\uFE0F",legend:[["P","\u{1F334}"],["I","\u2693"],["R","\u{1F99C}"],["A","\u2600\uFE0F"],["T","\u{1F5DD}\uFE0F"],["S","\u{1F30A}"],["E","\u{1F41A}"],["O","\u{1F419}"]],question:"\xDCbersetzt die Zeichen mit der Tabelle. Welches Wort ist eingeritzt?",answer:"PIRAT",hints:["Schau in der Tabelle nach: Welcher Buchstabe geh\xF6rt zur Palme \u{1F334}?","Der erste Buchstabe ist P, der zweite I \u2026 was k\xF6nnte das Wort sein?"]},successText:"PIRAT! Hinter der Rinde steckt eine zweite Goldm\xFCnze mit einer Ziffer \u2013 und ein Kartenst\xFCck, das zur Bananenplantage zeigt!"},{id:"bananen",name:"Bananenplantage",emoji:"\u{1F34C}",x:150,y:105,type:"cipher",story:
