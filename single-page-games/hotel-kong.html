<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hotel Kong 🐒</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; }
  html,body { height:100%; overflow:hidden; background:#1a2233; font-family:'Courier New',monospace; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  canvas { display:block; image-rendering:pixelated; background:#b8cfe8; }
  #controls {
    position:fixed; bottom:0; left:0; right:0; height:150px;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; pointer-events:none; z-index:10;
  }
  .pad { display:grid; grid-template-columns:56px 56px 56px; grid-template-rows:56px 56px; gap:4px; pointer-events:auto; }
  .btn {
    background:rgba(255,248,235,.18); border:2px solid rgba(255,248,235,.5);
    border-radius:12px; color:#fff8eb; font-size:24px; display:flex;
    align-items:center; justify-content:center; user-select:none;
    -webkit-user-select:none; font-weight:bold;
  }
  .btn:active, .btn.on { background:rgba(255,248,235,.45); }
  #btnUp { grid-column:2; grid-row:1; }
  #btnLeft { grid-column:1; grid-row:2; }
  #btnDown { grid-column:2; grid-row:2; }
  #btnRight { grid-column:3; grid-row:2; }
  #btnJump {
    width:88px; height:88px; border-radius:50%; pointer-events:auto;
    background:rgba(196,74,58,.55); border:3px solid rgba(255,248,235,.6);
    color:#fff8eb; font-size:20px; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; font-weight:bold;
  }
  #btnJump:active, #btnJump.on { background:rgba(196,74,58,.9); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="controls">
  <div class="pad">
    <div class="btn" id="btnUp">▲</div>
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnDown">▼</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div id="btnJump">JUMP</div>
</div>

  cv.width=W; cv.height=H;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
resize(); addEventListener('resize',resize);

// ---------- Level-Geometrie (Hotel-Etagen) ----------
// Plattformen: {x,y,w, type:'floor'|'roof'}
const FLOORS=[
  {x:0,   y:560, w:360, type:'ground'},          // Poolterrasse (durchgehend)
  {x:0,   y:480, w:300, type:'floor'},           // EG – offen rechts
  {x:60,  y:400, w:300, type:'floor'},           // 1. OG – offen links
  {x:0,   y:320, w:300, type:'floor'},           // 2. OG – offen rechts
  {x:60,  y:240, w:300, type:'floor'},           // 3. OG – offen links
  {x:0,   y:160, w:300, type:'roof'},            // Dach – Fässer fallen rechts runter
];
// Leitern: {x, y1(top), y2(bottom)}
const LADDERS=[
  {x:270, y1:480, y2:560},
  {x:85,  y1:400, y2:480},
  {x:280, y1:320, y2:400},
  {x:95,  y1:240, y2:320},
  {x:245, y1:160, y2:240},
];
const LW=22; // Leiterbreite

// ---------- Spielzustand ----------
let state='title'; // title | play | dead | win | over
let score=0, lives=3, level=1, frame=0, msgT=0;

const player={x:40,y:0,vx:0,vy:0,w:16,h:24,onGround:false,onLadder:false,face:1,climbFrame:0};
let barrels=[];
let spawnTimer=0;
const monkey={x:110,y:160-30,throwAnim:0};
const goal={x:265,y:160-26}; // Cocktail auf dem Dach

const keys={left:false,right:false,up:false,down:false,jump:false,jumpLatch:false};

function resetPlayer(){
  player.x=30; player.y=FLOORS[0].y-player.h; player.vx=0; player.vy=0;
  player.onLadder=false; player.face=1;
}
function startLevel(){
  barrels=[]; spawnTimer=40; resetPlayer(); state='play';
}
function fullReset(){ score=0; lives=3; level=1; startLevel(); }

// ---------- Physik-Helfer ----------
function floorAt(px,py){ // Plattform, auf der man stehen kann (Fusspunkt py)
  for(const f of FLOORS){
    if(px>=f.x-4 && px<=f.x+f.w+4 && Math.abs(py-f.y)<10 && py<=f.y+10) return f;
  }
  return null;
}
function ladderAt(px,py){
  for(const l of LADDERS){
    if(Math.abs(px-l.x)<LW*0.7 && py>=l.y1-6 && py<=l.y2+6) return l;
  }
  return null;
}

// ---------- Update ----------
function update(){
  frame++;
  if(state!=='play'){ if(msgT>0)msgT--; return; }

  const p=player;
  const feetX=p.x+p.w/2, feetY=p.y+p.h;

  // Leiter-Logik
  const lad=ladderAt(feetX, feetY-4) || ladderAt(feetX, feetY);
  if(!p.onLadder && lad){
    if(keys.up && feetY>lad.y1+4){ p.onLadder=true; p.x=lad.x-p.w/2; p.vy=0; p.vx=0; }
    else if(keys.down && Math.abs(feetY-lad.y1)<10 && feetY<lad.y2){ p.onLadder=true; p.x=lad.x-p.w/2; p.vy=0; }
  }
  if(p.onLadder){
    const l=ladderAt(feetX,feetY)||lad;
    if(!l){ p.onLadder=false; }
    else{
      if(keys.up)   p.y-=1.6;
      if(keys.down) p.y+=1.6;
      if(keys.up||keys.down) p.climbFrame++;
      // Oben angekommen
      if(p.y+p.h<=l.y1+2){ p.y=l.y1-p.h; p.onLadder=false; }
      // Unten angekommen
      if(p.y+p.h>=l.y2){ p.y=l.y2-p.h; p.onLadder=false; }
      // Seitlich absteigen erlaubt wenn Boden da
      if((keys.left||keys.right) && floorAt(feetX,p.y+p.h)) p.onLadder=false;
    }
  }

  if(!p.onLadder){
    // Laufen
    if(keys.left){ p.vx=-1.8; p.face=-1; }
    else if(keys.right){ p.vx=1.8; p.face=1; }
    else p.vx=0;
    // Springen
    if(keys.jump && !keys.jumpLatch && p.onGround){ p.vy=-5.4; p.onGround=false; keys.jumpLatch=true; }
    if(!keys.jump) keys.jumpLatch=false;
    p.vy+=0.28; if(p.vy>7)p.vy=7;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=0; if(p.x>W-p.w)p.x=W-p.w;
    // Landen
    p.onGround=false;
    if(p.vy>=0){
      const f=floorAt(p.x+p.w/2, p.y+p.h);
      if(f && p.y+p.h>=f.y-2 && p.y+p.h<=f.y+10){
        p.y=f.y-p.h; p.vy=0; p.onGround=true;
      }
    }
    // Runtergefallen
    if(p.y>H){ hit(); return; }
  }

  // Fässer spawnen (Affe wirft)
  spawnTimer--;
  const rate=Math.max(90, 180-level*15);
  if(spawnTimer<=0){
    spawnTimer=rate+Math.random()*70;
    monkey.throwAnim=20;
    barrels.push({x:monkey.x+20,y:monkey.y+14,vx:0.85+level*0.12,vy:0,r:8,fi:0,dropChance:0.35});
  }
  if(monkey.throwAnim>0)monkey.throwAnim--;

  // Fässer bewegen
  for(const b of barrels){
    b.fi+=0.15*Math.sign(b.vx||1);
    b.vy+=0.28; if(b.vy>7)b.vy=7;
    b.x+=b.vx; b.y+=b.vy;
    // Auf Plattform rollen
    const f=floorAt(b.x, b.y+b.r);
    if(b.vy>=0 && f && b.y+b.r>=f.y-2 && b.y+b.r<=f.y+10){
      b.y=f.y-b.r; b.vy=0;
      // Rollrichtung: immer zur offenen Kante der Etage
      const speed=Math.abs(b.vx);
      if(f.x>4)             b.vx=-speed;      // links offen → nach links rollen
      else if(f.x+f.w<W-4)  b.vx= speed;      // rechts offen → nach rechts rollen
      // (Boden: Richtung beibehalten, rollt aus dem Bild)
      // Zufällig eine Leiter runterkippen
      const l=ladderAt(b.x,b.y+b.r);
      if(l && Math.abs(b.y+b.r-l.y1)<6 && Math.random()<0.012){
        b.x=l.x; b.vy=2; b.y+=6;
      }
    }
    // KEIN Abprallen mehr – an der Kante fällt das Fass zur nächsten Etage
  }
  // entfernen, wenn aus dem Bild gerollt/gefallen
  barrels=barrels.filter(b=>{
    if(b.y>H+20 || b.x<-25 || b.x>W+25){ score+=10; return false; } // überlebt = Punkte
    return true;
  });

  // Kollision Fass vs. Spieler
  for(const b of barrels){
    const cx=Math.max(p.x,Math.min(b.x,p.x+p.w));
    const cy=Math.max(p.y,Math.min(b.y,p.y+p.h));
    if((b.x-cx)**2+(b.y-cy)**2 < (b.r-1)**2){ hit(); return; }
  }
  // Drübergesprungen? Bonuspunkte
  for(const b of barrels){
    if(!b.jumped && !p.onGround && p.y+p.h < b.y-4 && Math.abs((p.x+p.w/2)-b.x)<14){
      b.jumped=true; score+=50;
    }
  }

  // Ziel erreicht (Cocktail auf dem Dach)
  if(p.x+p.w>goal.x-6 && p.x<goal.x+18 && Math.abs((p.y+p.h)-(FLOORS[5].y))<8){
    score+=500*level; level++; state='win'; msgT=120;
  }
}

function hit(){
  lives--;
  if(lives<=0){ state='over'; msgT=0; }
  else { state='dead'; msgT=80; }
}

// ---------- Zeichnen ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}

function drawBackdrop(){
  if(photoReady){
    // Das echte Hotelfoto als Hintergrund
    ctx.drawImage(PHOTO,0,0,W,H);
    // Leichter Schleier, damit Spielfiguren gut lesbar bleiben
    ctx.fillStyle='rgba(215,230,248,.34)';
    ctx.fillRect(0,0,W,H);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,C.sky1); g.addColorStop(1,C.sky2);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
}

function drawFloors(){
  for(const f of FLOORS){
    if(f.type==='roof'){
      // Blaues Ziegeldach
      ctx.fillStyle=C.roofBlue; ctx.fillRect(f.x,f.y,f.w,14);
      ctx.fillStyle=C.roofLight;
      for(let x=f.x;x<f.x+f.w;x+=12) ctx.fillRect(x,f.y,6,14);
      // Solarpanels
      ctx.fillStyle=C.solar; ctx.fillRect(f.x+60,f.y-10,120,10);
      ctx.strokeStyle=C.solarLine; ctx.lineWidth=1;
      for(let x=f.x+60;x<=f.x+180;x+=15){ctx.beginPath();ctx.moveTo(x,f.y-10);ctx.lineTo(x,f.y);ctx.stroke();}
      // Kamin
      ctx.fillStyle=C.roofBlue; ctx.fillRect(f.x+f.w-70,f.y-22,16,22);
    } else if(f.type==='ground'){
      // Poolterrasse
      ctx.fillStyle=C.path; ctx.fillRect(f.x,f.y,f.w,H-f.y);
      ctx.fillStyle=C.pool; rr(150,f.y+30,140,40,10);
      ctx.fillStyle='rgba(255,255,255,.35)';
      for(let i=0;i<4;i++)ctx.fillRect(160+i*32,f.y+38+((frame/8+i)%3)*6,18,2);
      // Liegestühle
      ctx.fillStyle='#4a9ad0'; ctx.fillRect(60,f.y+20,26,6); ctx.fillRect(100,f.y+20,26,6);
      ctx.fillStyle='#d05a8a'; ctx.fillRect(60,f.y+40,26,6);
    } else {
      // Beige Hotel-Etage
      ctx.fillStyle=C.cream; ctx.fillRect(f.x,f.y,f.w,12);
      ctx.fillStyle=C.creamShadow; ctx.fillRect(f.x,f.y+12,f.w,4);
      // Balkonbrüstung mit Blumen
      ctx.fillStyle=C.creamDark;
      for(let x=f.x+6;x<f.x+f.w-8;x+=26) ctx.fillRect(x,f.y-10,4,10);
      ctx.fillStyle=C.cream; ctx.fillRect(f.x,f.y-12,f.w,4);
      ctx.fillStyle=C.flower;
      for(let x=f.x+14;x<f.x+f.w-10;x+=40){
        ctx.beginPath();ctx.arc(x,f.y-13,3,0,7);ctx.arc(x+6,f.y-14,3,0,7);ctx.arc(x+3,f.y-11,3,0,7);ctx.fill();
      }
      // Arkadenbögen unter der Etage
      ctx.fillStyle='rgba(120,100,70,.25)';
      for(let x=f.x+20;x<f.x+f.w-30;x+=60){
        ctx.beginPath();ctx.arc(x+15,f.y+58,15,Math.PI,0);ctx.rect(x,f.y+58,30,20);ctx.fill();
      }
    }
  }
  // Leitern
  for(const l of LADDERS){
    ctx.strokeStyle='#7a5a30'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(l.x-LW/2,l.y1);ctx.lineTo(l.x-LW/2,l.y2);
    ctx.moveTo(l.x+LW/2,l.y1);ctx.lineTo(l.x+LW/2,l.y2);
    ctx.stroke();
    ctx.lineWidth=2;
    for(let y=l.y1+5;y<l.y2;y+=10){ctx.beginPath();ctx.moveTo(l.x-LW/2,y);ctx.lineTo(l.x+LW/2,y);ctx.stroke();}
  }
  // Palmen/Büsche
  drawBush(120,556); drawBush(230,556); drawPalm(335,480);
}
function drawBush(x,y){
  ctx.fillStyle=C.leaf;
  ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.arc(x+12,y+2,10,0,7);ctx.arc(x-10,y+3,9,0,7);ctx.fill();
  ctx.fillStyle=C.leafDark;ctx.beginPath();ctx.arc(x+4,y+5,7,0,7);ctx.fill();
}
function drawPalm(x,y){
  ctx.strokeStyle='#8a6a40';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+4,y-20,x+2,y-34);ctx.stroke();
  ctx.strokeStyle=C.leaf;ctx.lineWidth=3;
  for(let a=0;a<5;a++){
    const ang=-Math.PI/2+(a-2)*0.5;
    ctx.beginPath();ctx.moveTo(x+2,y-34);
    ctx.quadraticCurveTo(x+2+Math.cos(ang)*16,y-34+Math.sin(ang)*10,x+2+Math.cos(ang)*26,y-30+Math.sin(ang)*14);
    ctx.stroke();
  }
}

function drawMonkey(){
  const m=monkey, t=m.throwAnim>0;
  const x=m.x,y=m.y+(t?-2:Math.sin(frame/20)*1.5);
  ctx.fillStyle=C.monkey;
  rr(x,y+8,26,20,6);                    // Körper
  ctx.beginPath();ctx.arc(x+13,y+4,10,0,7);ctx.fill(); // Kopf
  ctx.fillStyle=C.monkeyFace;
  ctx.beginPath();ctx.arc(x+13,y+6,6,0,7);ctx.fill();
  ctx.fillStyle='#000';
  ctx.fillRect(x+9,y+2,2,2);ctx.fillRect(x+15,y+2,2,2);
  ctx.fillStyle=C.monkey;
  ctx.beginPath();ctx.arc(x+3,y+2,4,0,7);ctx.arc(x+23,y+2,4,0,7);ctx.fill(); // Ohren
  // Arme
  ctx.strokeStyle=C.monkey;ctx.lineWidth=5;
  ctx.beginPath();
  if(t){ctx.moveTo(x+24,y+12);ctx.lineTo(x+34,y+4);}
  else{ctx.moveTo(x+24,y+12);ctx.lineTo(x+32,y+20);}
  ctx.moveTo(x+2,y+12);ctx.lineTo(x-6,y+20);
  ctx.stroke();
  // Fass in der Hand beim Werfen
  if(t){drawBarrel(x+38,y+2,7,0);}
}

function drawBarrel(x,y,r,fi){
  ctx.save();ctx.translate(x,y);ctx.rotate(fi);
  ctx.fillStyle=C.barrel;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle=C.barrelDark;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,r-1,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r+2,0);ctx.lineTo(r-2,0);ctx.moveTo(0,-r+2);ctx.lineTo(0,r-2);ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  const p=player;
  ctx.save();
  ctx.translate(p.x+p.w/2,p.y);
  if(p.face<0 && !p.onLadder)ctx.scale(-1,1);
  const walk=(p.onGround&&p.vx!==0)?Math.sin(frame/3)*3:0;
  const climb=p.onLadder?Math.sin(p.climbFrame/2)*3:0;
  // Beine
  ctx.strokeStyle=C.pants;ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-3,14);ctx.lineTo(-3+walk-climb,24);
  ctx.moveTo(3,14);ctx.lineTo(3-walk+climb,24);
  ctx.stroke();
  // Körper
  ctx.fillStyle=C.shirt;rr(-6,6,12,10,3);
  // Arme
  ctx.strokeStyle=C.shirt;ctx.lineWidth=3.5;
  ctx.beginPath();
  if(p.onLadder){ctx.moveTo(-5,8);ctx.lineTo(-7,2+climb);ctx.moveTo(5,8);ctx.lineTo(7,2-climb);}
  else{ctx.moveTo(-5,8);ctx.lineTo(-8+walk,15);ctx.moveTo(5,8);ctx.lineTo(8-walk,15);}
  ctx.stroke();
  // Kopf
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(0,1,6,0,7);ctx.fill();
  // Sonnenhut
  ctx.fillStyle='#e8d8a0';
  ctx.fillRect(-8,-4,16,3);ctx.fillRect(-5,-8,10,5);
  ctx.restore();
}

function drawGoal(){
  const g=goal, bob=Math.sin(frame/15)*2;
  // Cocktailglas
  ctx.fillStyle='rgba(255,200,80,.9)';
  ctx.beginPath();ctx.moveTo(g.x,g.y+bob);ctx.lineTo(g.x+14,g.y+bob);ctx.lineTo(g.x+7,g.y+10+bob);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(g.x,g.y+bob);ctx.lineTo(g.x+14,g.y+bob);ctx.lineTo(g.x+7,g.y+10+bob);ctx.closePath();
  ctx.moveTo(g.x+7,g.y+10+bob);ctx.lineTo(g.x+7,g.y+16+bob);
  ctx.moveTo(g.x+3,g.y+16+bob);ctx.lineTo(g.x+11,g.y+16+bob);
  ctx.stroke();
  // Schirmchen
  ctx.fillStyle=C.flower;
  ctx.beginPath();ctx.arc(g.x+11,g.y-5+bob,5,Math.PI,0);ctx.fill();
  ctx.strokeStyle=C.flower;ctx.beginPath();ctx.moveTo(g.x+11,g.y-5+bob);ctx.lineTo(g.x+9,g.y+2+bob);ctx.stroke();
  // Glitzer
  if(frame%40<20){ctx.fillStyle='#fff';ctx.fillRect(g.x+16,g.y-8+bob,2,2);}
}

function drawHUD(){
  ctx.fillStyle='rgba(20,30,50,.55)';rr(6,6,W-12,26,8);
  ctx.fillStyle='#fff8eb';ctx.font='bold 13px Courier New';
  ctx.textAlign='left';ctx.fillText('SCORE '+score,14,24);
  ctx.textAlign='center';ctx.fillText('LEVEL '+level,W/2,24);
  ctx.textAlign='right';ctx.fillText('❤'.repeat(Math.max(0,lives)),W-14,24);
}

function overlay(title,sub1,sub2){
  ctx.fillStyle='rgba(20,30,50,.72)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff8eb';ctx.textAlign='center';
  ctx.font='bold 30px Courier New';ctx.fillText(title,W/2,H/2-40);
  ctx.font='15px Courier New';
  if(sub1)ctx.fillText(sub1,W/2,H/2);
  if(sub2)ctx.fillText(sub2,W/2,H/2+26);
  ctx.font='bold 16px Courier New';ctx.fillStyle=C.gold;
  if(frame%50<32)ctx.fillText('▶ Tippen zum Starten ◀',W/2,H/2+70);
}

function draw(){
  drawBackdrop();
  drawFloors();
  drawGoal();
  drawMonkey();
  for(const b of barrels)drawBarrel(b.x,b.y,b.r,b.fi);
  drawPlayer();
  drawHUD();
  if(state==='title'){
    overlay('HOTEL KONG 🐒','Klettere zum Cocktail','auf dem Solardach!');
  } else if(state==='dead'){
    ctx.fillStyle='rgba(180,60,50,.35)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px Courier New';
    ctx.fillText('Autsch!',W/2,H/2);
    if(msgT<=0)startLevel();
  } else if(state==='win'){
    ctx.fillStyle='rgba(80,160,90,.3)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px Courier New';
    ctx.fillText('🍹 Prost! +'+(500*(level-1)),W/2,H/2);
    if(msgT<=0)startLevel();
  } else if(state==='over'){
    overlay('GAME OVER','Score: '+score,'Level '+level);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

// ---------- Steuerung ----------
function bindBtn(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('on');tapStart();};
  const off=e=>{e.preventDefault();keys[key]=false;el.classList.remove('on');};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
bindBtn('btnLeft','left');bindBtn('btnRight','right');
bindBtn('btnUp','up');bindBtn('btnDown','down');bindBtn('btnJump','jump');

function tapStart(){
  if(state==='title'||state==='over'){ fullReset(); }
}
cv.addEventListener('touchstart',e=>{e.preventDefault();tapStart();},{passive:false});
cv.addEventListener('mousedown',tapStart);

// Tastatur (falls am PC)
const kmap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',' ':'jump'};
addEventListener('keydown',e=>{if(kmap[e.key]!==undefined){keys[kmap[e.key]]=true;e.preventDefault();tapStart();}});
addEventListener('keyup',e=>{if(kmap[e.key]!==undefined){keys[kmap[e.key]]=false;e.preventDefault();}});

resetPlayer();
loop();
})();
</script>
