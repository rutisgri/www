<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163a30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What’s the time?">
<title>What’s the time?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E3F0E9; --surface:#FFFFFF; --ink:#15302A; --muted:#4F6B62; --line:#C4DACF;
  --chalk:#FFC83D; --chalk-ink:#3A2A00;
  --good:#1F8F5C; --bad:#D8414A;
  --paper:#FFFFFF; --paper-ink:#1B2A26; --paper-line:#B7D2EC; --paper-red:#E2575C;
  --shadow: 0 2px 0 rgba(21,48,42,.18);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#123229; --surface:#1B4236; --ink:#EAF4EF; --muted:#A3C3B7; --line:#2D5C4D;
    --shadow: 0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#123229; --surface:#1B4236; --ink:#EAF4EF; --muted:#A3C3B7; --line:#2D5C4D;
  --shadow: 0 2px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:18px; line-height:1.4; overflow-x:hidden;
  -webkit-tap-highlight-color: transparent;
}
#app{max-width:560px; margin:0 auto; padding:16px 16px 40px}
h1{font-size:2rem; line-height:1.1; margin:.2em 0 .1em; font-weight:800; letter-spacing:-.01em}
h2{font-size:1.25rem; margin:1.2em 0 .4em; font-weight:700}
p{margin:.3em 0}
.muted{color:var(--muted)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, svg:focus-visible, .group-row:focus-visible{outline:3px solid var(--chalk); outline-offset:2px}

.btn{
  display:flex; align-items:center; justify-content:center; gap:.4em;
  width:100%; min-height:56px; padding:10px 18px; border:0; border-radius:16px;
  font-size:1.15rem; font-weight:700;
  background:var(--chalk); color:var(--chalk-ink); box-shadow:var(--shadow);
}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn[disabled]{opacity:.45; transform:none}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:none; border:2px solid var(--line)}
.btn.good{background:var(--good); color:#fff}
.btn.bad{background:var(--bad); color:#fff}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px}
.back{background:none; border:0; padding:8px 4px; font-size:1.05rem; font-weight:600; color:var(--muted); min-height:44px}
.icon-btn{background:var(--surface); border:2px solid var(--line); border-radius:12px; min-width:44px; min-height:44px; font-size:1.1rem}
.icon-btn.off{opacity:.55; filter:grayscale(1)}
.top-right{display:flex; align-items:center; gap:8px}
.count-pill{font-weight:800; background:var(--surface); border-radius:999px; padding:4px 12px; box-shadow:var(--shadow)}

.hero{padding:10px 0 6px}
.hero .box-art{font-size:2.6rem; line-height:1}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start}
.hero-actions{display:flex; gap:8px}
.backup-btn{min-width:52px; min-height:52px; font-size:1.5rem; border-radius:14px}
.star-chip{display:inline-block; margin-top:10px; border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 16px; font-size:1.05rem; font-weight:800; box-shadow:var(--shadow)}

.list{display:flex; flex-direction:column; gap:10px; margin:8px 0 6px}
.group-row{
  display:block; width:100%; text-align:left; border:0;
  background:var(--surface); border-radius:18px; padding:14px 16px 16px;
  box-shadow:var(--shadow); border-left:8px solid var(--chalk);
}
.group-row .name{font-size:1.25rem; font-weight:700; display:block}
.group-row .meta{color:var(--muted); font-size:.95rem}
.row-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.row-awards{font-size:1.35rem; font-weight:700; white-space:nowrap; display:flex; gap:2px}
.boxbar{height:10px; border-radius:6px; overflow:hidden; margin-top:8px; background:var(--line)}
.boxbar span{display:block; height:100%; background:var(--good)}
.award-off{filter:grayscale(1); opacity:.28}
.goal{font-size:.95rem; color:var(--muted); margin:2px 0}
.panel{background:var(--surface); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin:12px 0}
.task-type{font-weight:700; color:var(--muted); margin:0 0 4px; font-size:1rem}

.progress{height:12px; background:var(--surface); border-radius:8px; overflow:hidden; margin:6px 0 14px}
.progress span{display:block; height:100%; background:var(--chalk); transition:width .3s}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* Analoge Uhr */
.clock{display:block; width:100%; height:auto; overflow:visible; user-select:none; -webkit-user-select:none}
.clock .hand{transform-origin:100px 100px; transform-box:view-box}
.clock.interactive{touch-action:none; cursor:grab}
.clock.interactive.dragging{cursor:grabbing}
.clock.locked{cursor:default}
.clock .knob{transition:r .15s}
.clock.dragging-m .mknob, .clock.dragging-h .hknob{r:11}
.clock-wrap{background:var(--paper); border-radius:22px; padding:14px; box-shadow:0 4px 0 rgba(0,0,0,.14), 0 10px 20px rgba(0,0,0,.10); max-width:min(380px, 48vh); margin:0 auto}
.legend{display:flex; justify-content:center; gap:16px; flex-wrap:wrap; font-size:.95rem; font-weight:700; color:var(--muted); margin:8px 0 2px}
.legend i{display:inline-block; width:22px; height:6px; border-radius:3px; vertical-align:middle; margin-right:5px}

/* Digitale Uhr */
.digi{display:block; width:100%; height:auto}
.digi-wrap{max-width:420px; margin:0 auto}
.steppers{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px auto 0; max-width:420px}
.stepper{background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:6px 8px 8px; text-align:center}
.stepper > span{display:block; font-weight:700; color:var(--muted); font-size:.95rem}
.stepper div{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.step{min-height:54px; border:0; border-radius:12px; background:var(--chalk); color:var(--chalk-ink); font-size:1.5rem; font-weight:800; box-shadow:var(--shadow); touch-action:manipulation}
.step:active{transform:translateY(2px); box-shadow:none}
.step:disabled{opacity:.4}

/* am/pm-Schieber */
.ampm{position:relative; display:grid; grid-template-columns:1fr 1fr; width:100%; max-width:380px; margin:14px auto 0; min-height:60px; padding:5px;
  border:0; border-radius:999px; background:var(--surface); box-shadow:var(--shadow); touch-action:none}
.ampm-opt{position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:6px; font-size:1.2rem; font-weight:800; color:var(--muted); transition:color .2s}
.ampm-thumb{position:absolute; top:5px; bottom:5px; left:5px; width:calc(50% - 5px); border-radius:999px; background:var(--chalk); box-shadow:0 2px 0 rgba(0,0,0,.15); transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.ampm[aria-checked="true"] .ampm-thumb{transform:translateX(100%); background:#3B4A8C}
.ampm[aria-checked="false"] .am, .ampm[aria-checked="true"] .pm{color:var(--chalk-ink)}
.ampm[aria-checked="true"] .pm{color:#fff}
.ampm:disabled{opacity:.6; cursor:default}
.ampm-help{text-align:center; font-size:.9rem; color:var(--muted); margin:6px 0 0}
.ampm-badge{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:0 12px; font-weight:800; font-size:1rem; background:var(--chalk); color:var(--chalk-ink)}
.ampm-badge.pm{background:#3B4A8C; color:#fff}

/* Lösung */
.solution{position:relative; background:var(--paper); color:var(--paper-ink); border-radius:18px; padding:14px 60px 14px 16px; margin:14px 0; border-top:5px solid var(--paper-red); box-shadow:0 4px 0 rgba(0,0,0,.14); animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.phrase{font-size:clamp(1.45rem, 7vw, 2rem); font-weight:800; line-height:1.15}
.period{font-size:1.15rem; font-weight:700; color:#4F6B62}
.digital-text{display:inline-block; margin-top:6px; font-weight:800; background:#EEF4FA; border-radius:10px; padding:0 10px; font-variant-numeric:tabular-nums}
.say{position:absolute; top:8px; right:8px; border:0; background:#EEF4FA; border-radius:10px; min-width:44px; min-height:44px; font-size:1.25rem; z-index:2}
.say.off{opacity:.55; filter:grayscale(1)}
@keyframes pop{from{transform:scale(.85); opacity:0}}

/* Karte (Zufall) */
.stack{position:relative; width:100%; margin:4px 0 30px}
.stack.analog{aspect-ratio:1 / 1.12; max-height:62vh; max-width:min(100%, calc(62vh / 1.12)); margin-left:auto; margin-right:auto}
.stack.digital{aspect-ratio:5 / 3.6}
.stack.analog.hand{aspect-ratio:1 / 1.1; max-width:min(100%, 46vh)}
.stack.hand{margin-bottom:26px}
.stack.hand .top-card{cursor:default}
.face .legend{color:#4F6B62; margin:4px 0 0; font-size:.9rem; gap:12px}
.paper{
  border-radius:12px; color:var(--paper-ink);
  background:linear-gradient(var(--paper-red),var(--paper-red)) 0 0 / 100% 5px no-repeat, var(--paper);
  box-shadow: 0 4px 0 rgba(0,0,0,.14), 0 10px 20px rgba(0,0,0,.10);
}
.under{position:absolute; inset:0}
.under.u1{transform:translateY(12px) scale(.955); filter:brightness(.96)}
.under.u2{transform:translateY(24px) scale(.91); filter:brightness(.91)}
.top-card{position:absolute; inset:0; perspective:1200px; cursor:pointer}
.top-card.away-near{animation:near .38s ease-in forwards}
.top-card.away-far{animation:far .42s ease-in forwards}
@keyframes near{to{transform:translateY(14px) scale(.95); opacity:0}}
@keyframes far{to{transform:translateY(40px) scale(.86) rotate(-4deg); opacity:0}}
.top-card.enter{animation:enter .25s ease-out}
@keyframes enter{from{transform:translateY(12px) scale(.955)}}
.card{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; padding:14px 16px 12px}
.face.back{transform:rotateY(180deg)}
.face .head{height:34px; display:flex; align-items:center; gap:8px; font-size:.95rem; font-weight:700; color:#6A7A75}
.face .show{flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
.face .show svg{max-height:100%; width:auto; max-width:100%; height:100%}
.face.digital .show svg{width:100%; height:auto}
.face .hint{font-size:.9rem; color:#6A7A75; text-align:center}
.face .back-text{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px}
.face .back-text .phrase{font-size:clamp(1.6rem, 8vw, 2.4rem)}
.face .mini-clock{width:34%; max-width:130px; margin-top:8px}

/* Ergebnis */
.result{text-align:center; padding:20px 0 6px}
.stars-won{font-size:3.2rem; line-height:1; margin-bottom:6px}
.stars-won span{display:inline-block; animation:pop2 .45s cubic-bezier(.3,1.6,.5,1) backwards}
.stars-won span:nth-child(2){animation-delay:.15s}
.stars-won span:nth-child(3){animation-delay:.3s}
@keyframes pop2{from{transform:scale(0) rotate(-30deg)}}
.new-award{display:flex; align-items:center; gap:12px; background:var(--chalk); color:var(--chalk-ink); border-radius:16px; padding:12px 16px; font-weight:700; font-size:1.1rem; margin:10px 0; box-shadow:var(--shadow)}
.new-award .icon{font-size:2.4rem; line-height:1}
.lost-award{display:flex; align-items:center; gap:12px; background:var(--surface); border:2px dashed color-mix(in srgb, var(--bad) 60%, var(--surface)); border-radius:16px; padding:12px 16px; font-weight:700; margin:10px 0}
.lost-award .icon{font-size:2.2rem; line-height:1}
.session-medal{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:1.15rem; background:var(--surface); border-radius:999px; padding:4px 16px; box-shadow:var(--shadow); margin-top:6px}
.missed-list{list-style:none; margin:0; padding:0}
.missed-list button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0; border-bottom:2px solid var(--line); padding:10px 2px; min-height:52px}
.missed-list li:last-child button{border-bottom:0}
.missed-list .t{font-weight:800; min-width:5.2em; font-variant-numeric:tabular-nums}
.missed-list .p{flex:1; color:var(--muted)}

/* Info */
.info-steps{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:10px; line-height:1.35}
.cheat{width:100%; border-collapse:collapse; font-size:1rem}
.cheat td{padding:6px 4px; border-bottom:2px solid var(--line)}
.cheat tr:last-child td{border-bottom:0}
.cheat td:first-child{font-weight:800; width:4.5em; font-variant-numeric:tabular-nums}
.msg{min-height:1.4em; font-size:.95rem; font-weight:600; margin:4px 0 8px}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}

/* Dialog */
dialog{border:0; border-radius:20px; padding:20px; width:min(92vw, 440px); background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(10,30,24,.55)}
dialog h3{margin:0 0 12px; font-size:1.3rem}
.dlg-actions{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.banner{background:var(--bad); color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:.95rem}

canvas.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}

@media (prefers-reduced-motion: reduce){
  .card,.progress span,.ampm-thumb{transition:none}
  .top-card{animation-duration:.01s !important}
  .stars-won span,.solution{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>

<script>
(function(){
"use strict";
const KEY = "uhrenkiste-v1";
const ROUND = 10;
const app = document.getElementById("app");
const dlg = document.getElementById("dlg");
const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Übungen ---------- */
const MODES = [
  { key:"analog-hand",  face:"analog",  how:"hand", faceIcon:"🕰️", faceName:"Analoge Uhr",  howIcon:"✋", howName:"Selbst stellen", desc:"Zeiger stellen, dann die Uhrzeit sagen" },
  { key:"analog-auto",  face:"analog",  how:"auto", faceIcon:"🕰️", faceName:"Analoge Uhr",  howIcon:"🎲", howName:"Zufall",         desc:"Eine Uhrzeit erscheint, du sagst sie" },
  { key:"digital-hand", face:"digital", how:"hand", faceIcon:"📟", faceName:"Digitale Uhr", howIcon:"✋", howName:"Selbst stellen", desc:"Ziffern stellen, dann die Uhrzeit sagen" },
  { key:"digital-auto", face:"digital", how:"auto", faceIcon:"📟", faceName:"Digitale Uhr", howIcon:"🎲", howName:"Zufall",         desc:"Eine Uhrzeit erscheint, du sagst sie" }
];
const modeOf = k => MODES.find(m => m.key === k) || MODES[0];
const MEDALS = [
  { lv:1, icon:"🥉", name:"Bronze", need:4,  avg:4,   stars:1 },
  { lv:2, icon:"🥈", name:"Silber", need:8,  avg:8,   stars:2 },
  { lv:3, icon:"🥇", name:"Gold",   need:10, avg:9.5, stars:3 }
];
// Medaille einer einzelnen Runde: ab 4 Bronze, ab 8 Silber, 10 Gold
function roundLevel(score){ return MEDALS.filter(m => score >= m.need).length; }
// Medaille einer Übung aus dem Durchschnitt aller Runden (Gold ab Ø 9,5)
function modeLevel(st){ const a = avg(st); return a === null ? 0 : MEDALS.filter(m => a >= m.avg).length; }
function avg(st){ return st.scores.length ? st.scores.reduce((a, b) => a + b, 0) / st.scores.length : null; }

/* ---------- Speichern ---------- */
let storageOk = true;
let S = load();
let ui = { session: null, result: null, backupMsg: null };

function blank(){
  const modes = {};
  MODES.forEach(m => modes[m.key] = { scores: [], stars: 0 });
  return { modes, settings: { autoSpeak: true }, lastBackup: null };
}
function load(){
  let d = null;
  try{ const raw = localStorage.getItem(KEY); if(raw) d = JSON.parse(raw); }catch(e){ storageOk = false; }
  return fix(d);
}
function fix(d){
  const b = blank();
  if(!d || typeof d !== "object") return b;
  if(!d.modes || typeof d.modes !== "object") d.modes = {};
  MODES.forEach(m => {
    const st = d.modes[m.key];
    if(!st || !Array.isArray(st.scores)) d.modes[m.key] = { scores: [], stars: 0 };
    else st.stars = +st.stars || 0;
  });
  if(!d.settings) d.settings = b.settings;
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }catch(e){ storageOk = false; }
}
function totalStars(){ return MODES.reduce((a, m) => a + S.modes[m.key].stars, 0); }

/* ---------- Hilfen ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }
function num(x){ return x.toLocaleString("de-DE", { maximumFractionDigits: 1 }); }
function banner(){
  return storageOk ? "" : '<div class="banner" role="alert">Speichern ist in diesem Browser gerade nicht möglich. Fortschritte gehen beim Schließen verloren.</div>';
}

/* ---------- Uhrzeit auf Englisch (britisch) ---------- */
const HOURS = ["twelve","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const MINS = { 5:"five", 10:"ten", 20:"twenty", 25:"twenty-five" };
const h24 = t => (t.h % 12) + (t.pm ? 12 : 0);
const pad = n => String(n).padStart(2, "0");
function digitalText(t){ return `${t.h}:${pad(t.m)} ${t.pm ? "pm" : "am"}`; }
function phraseOf(t){
  const H = h24(t), m = t.m, h = t.h, next = h % 12 + 1;
  let core;
  if(m === 0) core = `${HOURS[h]} o’clock`;
  else if(m <= 30) core = `${m === 15 ? "quarter" : m === 30 ? "half" : MINS[m]} past ${HOURS[h]}`;
  else { const r = 60 - m; core = `${r === 15 ? "quarter" : MINS[r]} to ${HOURS[next]}`; }
  let period;
  if(m === 0 && H === 12) period = "midday";
  else if(m === 0 && H === 0) period = "midnight";
  else if(H >= 5 && H < 12) period = "in the morning";
  else if(H >= 12 && H < 18) period = "in the afternoon";
  else if(H >= 18 && H < 21) period = "in the evening";
  else period = "at night";
  const main = `It’s ${core}`;
  const spoken = (period === "midday" || period === "midnight") ? `${main}. It’s ${period}.` : `${main} ${period}.`;
  return { main, period: (period === "midday" || period === "midnight") ? `It’s ${period}.` : period, spoken };
}
function randomTime(used){
  let t, k, n = 0;
  do{
    t = { h: 1 + Math.floor(Math.random() * 12), m: 5 * Math.floor(Math.random() * 12), pm: Math.random() < .5 };
    k = `${t.h}:${t.m}:${t.pm}`; n++;
  }while(used.has(k) && n < 200);
  used.add(k);
  return t;
}

/* ---------- Sprechen ---------- */
let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === "en-GB") || vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }catch(e){}
}
if("speechSynthesis" in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = .88; if(voice) u.voice = voice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function speakTime(t){ speak(phraseOf(t).spoken); }

/* ---------- Analoge Uhr (SVG) ---------- */
function analogSVG(t, opts){
  opts = opts || {};
  let ticks = "", nums = "";
  for(let i = 0; i < 60; i++){
    const a = i * Math.PI / 30, big = i % 5 === 0, r1 = big ? 80 : 85, r2 = 89;
    ticks += `<line x1="${(100 + r1 * Math.sin(a)).toFixed(2)}" y1="${(100 - r1 * Math.cos(a)).toFixed(2)}" x2="${(100 + r2 * Math.sin(a)).toFixed(2)}" y2="${(100 - r2 * Math.cos(a)).toFixed(2)}" stroke="#15302A" stroke-width="${big ? 3 : 1.4}" stroke-linecap="round"/>`;
  }
  for(let n = 1; n <= 12; n++){
    const a = n * Math.PI / 6;
    nums += `<text x="${(100 + 67 * Math.sin(a)).toFixed(2)}" y="${(100 - 67 * Math.cos(a)).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="'Baloo 2','Trebuchet MS',system-ui,sans-serif" font-weight="800" font-size="21" fill="#15302A">${n}</text>`;
  }
  const knobs = opts.interactive;
  return `<svg class="clock ${opts.interactive ? "interactive" : ""} ${opts.cls || ""}" ${opts.id ? `id="${opts.id}"` : ""} viewBox="0 0 200 200" ${opts.interactive ? 'tabindex="0" role="img" aria-label="Uhr: Zeiger ziehen, oder mit den Pfeiltasten stellen"' : 'aria-hidden="true"'}>
    <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#15302A" stroke-width="6"/>
    <circle cx="100" cy="100" r="90" fill="none" stroke="#E3F0E9" stroke-width="2"/>
    ${ticks}${nums}
    <g class="hand hh" style="transform:rotate(${hourAngle(t)}deg)">
      <line x1="100" y1="112" x2="100" y2="50" stroke="#15302A" stroke-width="10" stroke-linecap="round"/>
      ${knobs ? '<circle class="knob hknob" cx="100" cy="50" r="9" fill="#15302A"/>' : ""}
    </g>
    <g class="hand mh" style="transform:rotate(${t.m * 6}deg)">
      <line x1="100" y1="116" x2="100" y2="${knobs ? 17 : 22}" stroke="#E2575C" stroke-width="6" stroke-linecap="round"/>
      ${knobs ? '<circle class="knob mknob" cx="100" cy="16" r="8" fill="#E2575C"/>' : ""}
    </g>
    <circle cx="100" cy="100" r="7" fill="#FFC83D" stroke="#15302A" stroke-width="3"/>
  </svg>`;
}
function hourAngle(t){ return (t.h % 12) * 30 + t.m * .5; }
function setHands(svg, t){
  svg.querySelector(".hh").style.transform = `rotate(${hourAngle(t)}deg)`;
  svg.querySelector(".mh").style.transform = `rotate(${t.m * 6}deg)`;
}

/* ---------- Digitale Uhr (Sieben-Segment-Anzeige) ---------- */
const SEGS = { 0:"abcdef", 1:"bc", 2:"abged", 3:"abgcd", 4:"fgbc", 5:"afgcd", 6:"afgedc", 7:"abc", 8:"abcdefg", 9:"abcdfg" };
function digitSVG(d, x){
  const w = 40, h = 72, t = 8, g = 1.2, on = d === null ? "" : SEGS[d];
  const hor = (y, s) => `<polygon class="${on.includes(s) ? "on" : "off"}" points="${x+t/2+g},${y} ${x+t+g},${y-t/2} ${x+w-t-g},${y-t/2} ${x+w-t/2-g},${y} ${x+w-t-g},${y+t/2} ${x+t+g},${y+t/2}"/>`;
  const ver = (cx, y1, y2, s) => `<polygon class="${on.includes(s) ? "on" : "off"}" points="${cx},${y1+t/2+g} ${cx+t/2},${y1+t+g} ${cx+t/2},${y2-t-g} ${cx},${y2-t/2-g} ${cx-t/2},${y2-t-g} ${cx-t/2},${y1+t+g}"/>`;
  return hor(t/2, "a") + ver(x+w-t/2, 0, h/2, "b") + ver(x+w-t/2, h/2, h, "c") + hor(h-t/2, "d") + ver(x+t/2, h/2, h, "e") + ver(x+t/2, 0, h/2, "f") + hor(h/2, "g");
}
function digitalSVG(t, id){
  const h1 = t.h >= 10 ? 1 : null, h2 = t.h % 10, m1 = Math.floor(t.m / 10), m2 = t.m % 10;
  return `<svg class="digi" ${id ? `id="${id}"` : ""} viewBox="-22 -22 318 116" aria-hidden="true">
    <rect x="-22" y="-22" width="318" height="116" rx="18" fill="#15302A"/>
    <rect x="-14" y="-14" width="302" height="100" rx="12" fill="#0E241F"/>
    <g transform="skewX(-6) translate(4 0)" fill="currentColor">
      <style>.on{fill:#FFC83D}.off{fill:rgba(255,200,61,.08)}</style>
      ${digitSVG(h1, 0)}${digitSVG(h2, 50)}
      <circle cx="108" cy="22" r="5" class="on"/><circle cx="108" cy="50" r="5" class="on"/>
      ${digitSVG(m1, 122)}${digitSVG(m2, 172)}
    </g>
    <text x="250" y="24" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',system-ui,sans-serif" font-weight="800" font-size="20" fill="${t.pm ? "rgba(255,200,61,.15)" : "#FFC83D"}">AM</text>
    <text x="250" y="58" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',system-ui,sans-serif" font-weight="800" font-size="20" fill="${t.pm ? "#FFC83D" : "rgba(255,200,61,.15)"}">PM</text>
  </svg>`;
}

/* ---------- Router ---------- */
function go(hash, replace){
  if(location.hash === hash){ render(); return; }
  if(replace) location.replace(hash); else location.hash = hash;
}
window.addEventListener("hashchange", render);
function render(){
  const h = location.hash;
  if(h !== "#ergebnis") document.querySelectorAll("canvas.confetti").forEach(c => c.remove());
  if(h === "#ueben" && ui.session) return renderPractice();
  if(h === "#ergebnis" && ui.result) return renderResult();
  if(h === "#sicherung") return renderBackup();
  if(h === "#info") return renderInfo();
  if(h && h !== "#start"){ history.replaceState(null, "", location.pathname + location.search); }
  ui.session = null;
  renderHome();
}

/* ---------- Üben ---------- */
function startSession(key){
  const used = new Set();
  ui.session = { mode: modeOf(key), results: [], used, cur: null, revealed: false, busy: false, entering: false,
    set: { h: 1 + Math.floor(Math.random() * 12), m: 5 * Math.floor(Math.random() * 12), pm: Math.random() < .5 } };
  ui.result = null;
  go("#ueben");
}
function practiceHead(s){
  return banner() + `
    <div class="topbar">
      <button class="back" id="back">‹ Beenden</button>
      <div class="top-right">
        <span class="count-pill" aria-label="Uhrzeit ${s.results.length + 1} von ${ROUND}">${s.results.length + 1} / ${ROUND}</span>

}
function wireHead(s){

    }
    try{ speechSynthesis.cancel(); }catch(e){}
    ui.session = null; go("#start", true);
  };
}
// Lautsprecher: schaltet das Vorlesen aus und wieder ein (bleibt gespeichert). Beim Einschalten wird die Lösung gleich vorgelesen.
function speakBtn(){
  const on = S.settings.autoSpeak !== false;
  return `<button class="say ${on ? "" : "off"}" id="say" aria-pressed="${on}" aria-label="Vorlesen ${on ? "ausschalten" : "einschalten"}">${on ? "🔊" : "🔇"}</button>`;
}
function toggleSpeak(sayNow){
  S.settings.autoSpeak = S.settings.autoSpeak === false; save();
  const on = S.settings.autoSpeak !== false;
  document.querySelectorAll(".say").forEach(b => {
    b.textContent = on ? "🔊" : "🔇"; b.classList.toggle("off", !on);
    b.setAttribute("aria-pressed", on);

}
function solutionHTML(t){

}
function answersHTML(){
  return `<div class="answers"><button class="btn bad" id="no">✗ Nicht gewusst</button><button class="btn good" id="yes">✓ Gewusst</button></div>`;
}
function ampmHTML(pm, disabled){
  return `<button class="ampm" id="ampm" role="switch" aria-checked="${pm}" aria-label="Vor oder nach dem Mittag: ${pm ? "pm" : "am"}" ${disabled ? "disabled" : ""}>
      <span class="ampm-thumb" aria-hidden="true"></span>

function renderPractice(){

/* Selbst stellen */
// Rückseite der Karte mit der Lösung
function backInner(t, digital){
  const p = phraseOf(t);
  return `<div class="head">🇬🇧 English</div>
    ${speakBtn()}
    <div class="back-text">
      <div class="phrase">${esc(p.main)}</div>
      <div class="period">${esc(p.period)}</div>
      <span class="digital-text">${esc(digitalText(t))}</span>
      ${digital ? "" : `<div class="mini-clock">${analogSVG(t)}</div>`}
    </div>`;
}
function renderHand(s){
  const t = s.set, digital = s.mode.face === "digital", left = ROUND - s.results.length;
  app.innerHTML = practiceHead(s) + `
    <div class="stack ${digital ? "digital" : "analog"} hand">
      ${left > 2 ? '<div class="under u2 paper" aria-hidden="true"></div>' : ""}
      ${left > 1 ? '<div class="under u1 paper" aria-hidden="true"></div>' : ""}
      <div class="top-card ${s.entering ? "enter" : ""}" id="top">
        <div class="card ${s.revealed ? "flipped" : ""}" id="card">
          <div class="face front paper ${digital ? "digital" : ""}">
            <div class="show" id="show">${digital ? digitalSVG(t, "digi") : analogSVG(t, { interactive: true, id: "clock", cls: s.revealed ? "locked" : "" })}</div>
            ${digital ? '<div class="hint">Stell die Uhrzeit und sag sie auf Englisch.</div>' : '<div class="legend"><span><i style="background:#E2575C"></i>lang: Minuten</span><span><i style="background:#15302A;height:9px"></i>kurz: Stunden</span></div>'}
          </div>
          <div class="face back paper" id="backFace">${backInner(t, digital)}</div>
        </div>
      </div>
    </div>
    ${digital
      ? `<div class="steppers">
           <div class="stepper"><span>Stunden</span><div><button class="step" data-step="h-" aria-label="Stunde zurück" ${s.revealed ? "disabled" : ""}>▼</button><button class="step" data-step="h+" aria-label="Stunde vor" ${s.revealed ? "disabled" : ""}>▲</button></div></div>
           <div class="stepper"><span>Minuten</span><div><button class="step" data-step="m-" aria-label="5 Minuten zurück" ${s.revealed ? "disabled" : ""}>▼</button><button class="step" data-step="m+" aria-label="5 Minuten vor" ${s.revealed ? "disabled" : ""}>▲</button></div></div>
         </div>`
      : ""}
    ${ampmHTML(t.pm, s.revealed)}
    <div id="controls" style="margin-top:16px">${s.revealed ? answersHTML() : '<button class="btn" id="reveal">👀 Auflösung</button>'}</div>
  `;
  s.entering = false;
  const redraw = () => {
    if(digital){ document.getElementById("show").innerHTML = digitalSVG(t, "digi"); }
    else setHands(document.getElementById("clock"), t);
  };
  // am/pm-Schieber: Antippen einer Seite wählt sie, Wischen auch, Tastatur wechselt
  const sw = document.getElementById("ampm");
  sw.onclick = e => {
    if(s.revealed) return;
    const r = sw.getBoundingClientRect();
    if(e.detail === 0 || !e.clientX) t.pm = !t.pm;
    else t.pm = e.clientX > r.left + r.width / 2;
    sw.setAttribute("aria-checked", t.pm);
    sw.setAttribute("aria-label", "Vor oder nach dem Mittag: " + (t.pm ? "pm" : "am"));
    redraw();
  };
  if(digital){
    app.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
      if(s.revealed) return;
      const k = b.dataset.step;
      if(k === "h+") t.h = t.h % 12 + 1;
      if(k === "h-") t.h = t.h === 1 ? 12 : t.h - 1;
      if(k === "m+") t.m = (t.m + 5) % 60;
      if(k === "m-") t.m = (t.m + 55) % 60;
      redraw();
    });
  } else if(!s.revealed){
    wireDrag(document.getElementById("clock"), t);
  }
  wireReveal(s, t);
}
function stepMinutes(t, d){
  const m = t.m + d;
  if(m >= 60){ t.m = m - 60; t.h = t.h % 12 + 1; }
  else if(m < 0){ t.m = m + 60; t.h = t.h === 1 ? 12 : t.h - 1; }
  else t.m = m;
}
function wireDrag(svg, t){
  let target = null;
  const angleAt = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 200 - 100, y = (e.clientY - r.top) / r.height * 200 - 100;
    let a = Math.atan2(x, -y) * 180 / Math.PI; if(a < 0) a += 360;
    return { a, d: Math.hypot(x, y) };
  };
  const diff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
  const apply = a => {
    if(target === "m"){
      const nm = Math.round(a / 30) * 5 % 60;
      if(nm === t.m) return;
      if(t.m >= 45 && nm <= 15) t.h = t.h % 12 + 1;
      else if(t.m <= 15 && nm >= 45) t.h = t.h === 1 ? 12 : t.h - 1;
      t.m = nm;
    } else {
      let nh = Math.round(a / 30 - t.m / 60) % 12; if(nh <= 0) nh += 12;
      if(nh === t.h) return;
      t.h = nh;
    }
    setHands(svg, t);
  };
  svg.addEventListener("pointerdown", e => {
    if(svg.classList.contains("locked")) return;
    const p = angleAt(e);
    if(p.d > 110) return;
    const dm = diff(p.a, t.m * 6), dh = diff(p.a, hourAngle(t));
    target = (p.d < 62 && dh < dm + 25) || dh + 8 < dm ? "h" : "m";
    svg.classList.add("dragging", "dragging-" + target);
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
    apply(p.a);
  });
  svg.addEventListener("pointermove", e => { if(target) apply(angleAt(e).a); });
  const end = () => { target = null; svg.classList.remove("dragging", "dragging-m", "dragging-h"); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("keydown", e => {
    if(svg.classList.contains("locked")) return;
    const k = e.key;
    if(k === "ArrowRight" || k === "ArrowUp") stepMinutes(t, 5);
    else if(k === "ArrowLeft" || k === "ArrowDown") stepMinutes(t, -5);
    else if(k === "PageUp") t.h = t.h % 12 + 1;
    else if(k === "PageDown") t.h = t.h === 1 ? 12 : t.h - 1;
    else return;
    e.preventDefault(); setHands(svg, t);
  });
}
function wireReveal(s, t){
  const digital = s.mode.face === "digital";
  const wireSay = () => {
    const say = document.getElementById("say");
    if(say) say.onclick = e => { e.stopPropagation(); toggleSpeak(() => speakTime(t)); };
  };
  const wireAnswers = () => {
    const no = document.getElementById("no"), yes = document.getElementById("yes");
    if(no) no.onclick = () => answer(false);
    if(yes) yes.onclick = () => answer(true);
  };
  // Auflösung: die Karte dreht sich um, wie beim Zufall
  const rv = document.getElementById("reveal");
  if(rv) rv.onclick = () => {
    if(s.revealed) return;
    s.revealed = true;
    document.getElementById("backFace").innerHTML = backInner(t, digital);
    wireSay();
    const clock = document.getElementById("clock"); if(clock) clock.classList.add("locked");
    const sw = document.getElementById("ampm"); if(sw) sw.disabled = true;
    app.querySelectorAll("[data-step]").forEach(b => b.disabled = true);
    document.getElementById("card").classList.add("flipped");
    document.getElementById("controls").innerHTML = answersHTML();
    wireAnswers();
    if(S.settings.autoSpeak !== false) speakTime(t);
  };
  wireSay(); wireAnswers();
}

/* Zufall: Karte umdrehen */
function renderAuto(s){
  if(!s.cur) s.cur = randomTime(s.used);
  const t = s.cur, digital = s.mode.face === "digital", left = ROUND - s.results.length;
  const badge = `<span class="ampm-badge ${t.pm ? "pm" : ""}">${t.pm ? "🌙 pm" : "☀️ am"}</span>`;
  app.innerHTML = practiceHead(s) + `
    <div class="stack ${digital ? "digital" : "analog"}">
      ${left > 2 ? '<div class="under u2 paper" aria-hidden="true"></div>' : ""}
      ${left > 1 ? '<div class="under u1 paper" aria-hidden="true"></div>' : ""}
      <div class="top-card ${s.entering ? "enter" : ""}" id="top">
        <div class="card ${s.revealed ? "flipped" : ""}" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
          <div class="face front paper ${digital ? "digital" : ""}">
            <div class="head">${digital ? "What’s the time?" : badge}</div>
            <div class="show">${digital ? digitalSVG(t) : analogSVG(t)}</div>
            <div class="hint">Sag die Uhrzeit auf Englisch. Tippe zum Umdrehen.</div>
          </div>
          <div class="face back paper">
            <div class="head">🇬🇧 English</div>
            ${speakBtn()}
            <div class="back-text">
              <div class="phrase">${esc(phraseOf(t).main)}</div>
              <div class="period">${esc(phraseOf(t).period)}</div>
              <span class="digital-text">${esc(digitalText(t))}</span>
              ${digital ? "" : `<div class="mini-clock">${analogSVG(t)}</div>`}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="controls">${s.revealed ? answersHTML() : '<button class="btn" id="reveal">👀 Lösung</button>'}</div>
  `;
  s.entering = false;
  const card = document.getElementById("card");
  const flip = () => {
    if(s.revealed) return;
    s.revealed = true; card.classList.add("flipped");
    document.getElementById("controls").innerHTML = answersHTML();
    document.getElementById("no").onclick = () => answer(false);
    document.getElementById("yes").onclick = () => answer(true);
    if(S.settings.autoSpeak !== false) speakTime(t);
  };
  card.onclick = e => { if(e.target.closest(".say")) return; flip(); };
  card.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); } };
  const rv = document.getElementById("reveal"); if(rv) rv.onclick = flip;
  document.getElementById("say").onclick = e => { e.stopPropagation(); toggleSpeak(() => speakTime(t)); };
  if(s.revealed){
    document.getElementById("no").onclick = () => answer(false);
    document.getElementById("yes").onclick = () => answer(true);
  }
}

function answer(ok){
  const s = ui.session;
  if(!s || s.busy) return;
  s.busy = true;
  const t = s.mode.how === "hand" ? s.set : s.cur;
  s.results.push({ t: { h: t.h, m: t.m, pm: t.pm }, ok });
  const next = () => {
    s.busy = false; s.revealed = false;
    s.entering = true;
    if(s.mode.how === "auto") s.cur = null;
    if(s.results.length >= ROUND) finish(); else renderPractice();
  };
  const top = document.getElementById("top");
  if(top && !reduced){ top.classList.add(ok ? "away-near" : "away-far"); setTimeout(next, 400); }
  else next();
}

function finish(){
  const s = ui.session, st = S.modes[s.mode.key];
  const score = s.results.filter(r => r.ok).length;
  const before = modeLevel(st);
  st.scores.push(score);
  const lv = roundLevel(score), stars = lv ? MEDALS[lv - 1].stars : 0;
  st.stars += stars;
  save();
  ui.result = { mode: s.mode, score, lv, stars, before, after: modeLevel(st), average: avg(st), rounds: st.scores.length,
    missed: s.results.filter(r => !r.ok).map(r => r.t) };
  ui.session = null;
  history.replaceState(null, "", "#ergebnis");
  renderResult();
}

/* ---------- Ergebnis ---------- */
function renderResult(){
  const r = ui.result, m = r.mode;
  const face = r.score === ROUND ? "🤩" : r.score >= 8 ? "😄" : r.score >= 4 ? "🙂" : "💪";
  const line = r.score === ROUND ? "Alles gewusst. Super!" : r.score >= 8 ? "Sehr gut gemacht!" : r.score >= 4 ? "Gut geübt!" : "Dranbleiben, das wird!";
  const medal = r.lv ? MEDALS[r.lv - 1] : null;
  const nextNeed = MEDALS.find(x => x.need > r.score);
  const modeName = `${m.faceName}, ${m.howName}`;
  let change = "";
  if(r.after > r.before) change = `<div class="new-award"><span class="icon">${MEDALS[r.after - 1].icon}</span><span>Neue ${MEDALS[r.after - 1].name}-Medaille für ${esc(modeName)}! ${m.howIcon}</span></div>`;
  else if(r.after < r.before) change = `<div class="lost-award"><span class="icon award-off">${MEDALS[r.before - 1].icon}</span><span>${MEDALS[r.before - 1].name}-Medaille für ${esc(modeName)} verloren. Üb weiter, dann holst du sie zurück!</span></div>`;
  app.innerHTML = banner() + `
    <div class="result">
      <div class="stars-won" aria-label="${r.stars} von 3 Sternen">${[1,2,3].map(i => `<span class="${i <= r.stars ? "" : "award-off"}">⭐</span>`).join("")}</div>
      <h1>Runde geschafft! ${face}</h1>
      <p style="font-size:1.2rem">${r.score} von ${ROUND} gewusst.</p>
      <p class="muted">${line}${r.stars ? ` +${r.stars} ⭐` : ""}</p>
      ${medal ? `<span class="session-medal">${medal.icon} ${medal.name} in dieser Runde</span>`
              : `<p class="goal">Ab 4 gewussten Uhrzeiten gibt es Bronze.</p>`}
      ${medal && nextNeed ? `<p class="goal" style="margin-top:6px">Mit ${nextNeed.need} gewussten gibt es ${nextNeed.icon} ${nextNeed.name}.</p>` : ""}
    </div>
    ${change}
    <section class="panel">
      <p style="margin:0"><strong>${m.faceIcon} ${esc(modeName)}</strong></p>
      <p class="goal">Ø ${num(r.average)} von ${ROUND} aus ${plural(r.rounds, "Runde", "Runden")}</p>
      <p style="font-size:1.6rem;margin:4px 0 0">${medalRow(r.after)}</p>
    </section>
    ${r.missed.length ? `<section class="panel">
      <h2 style="margin-top:0">Diese Uhrzeiten nochmal üben</h2>
      <ul class="missed-list">${r.missed.map((t, i) => `<li><button data-miss="${i}"><span class="t">${esc(digitalText(t))}</span><span class="p">${esc(phraseOf(t).main)} ${esc(phraseOf(t).period)}</span><span aria-hidden="true">🔊</span></button></li>`).join("")}</ul>
    </section>` : ""}
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
      <button class="btn" id="again">▶ Noch eine Runde</button>
      <button class="btn ghost" id="home">Zurück</button>
    </div>
  `;
  if(r.score === ROUND && !r.confettiDone){ r.confettiDone = true; launchConfetti(); }
  app.querySelectorAll("[data-miss]").forEach(b => b.onclick = () => speakTime(r.missed[+b.dataset.miss]));
  document.getElementById("again").onclick = () => { const k = r.mode.key; ui.result = null; history.replaceState(null, "", "#start"); startSession(k); };
  document.getElementById("home").onclick = () => { ui.result = null; go("#start", true); };
  window.scrollTo(0, 0);
}

/* ---------- Konfetti ---------- */
function launchConfetti(){
  try{
    if(reduced) return;
    document.querySelectorAll("canvas.confetti").forEach(c => c.remove());
    const c = document.createElement("canvas");
    c.className = "confetti"; c.setAttribute("aria-hidden", "true");
    document.body.appendChild(c);
    const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const x = c.getContext("2d"); x.scale(dpr, dpr);
    const colors = ["#FFC83D", "#1F8F5C", "#E5484D", "#4FC3F7", "#F08C2E", "#B57EDC"];
    const parts = [];
    for(let i = 0; i < 160; i++){
      const left = i % 2 === 0, delay = i < 80 ? 0 : 0.35;
      parts.push({ x: left ? -10 : W + 10, y: H * .75, vx: (left ? 1 : -1) * (5 + Math.random() * 9), vy: -(12 + Math.random() * 10),
        w: 7 + Math.random() * 6, h: 11 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[i % colors.length], delay, flip: Math.random() * 6 });
    }
    const start = performance.now();
    let last = start;
    const frame = now => {
      const t = (now - start) / 1000, dt = Math.min(.033, (now - last) / 1000) * 60; last = now;
      x.clearRect(0, 0, W, H);
      parts.forEach(p => {
        if(t < p.delay) return;
        p.vy += .32 * dt; p.vx *= Math.pow(.985, dt); p.vy *= Math.pow(.99, dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.flip += .15 * dt;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.scale(1, Math.cos(p.flip));
        x.globalAlpha = Math.max(0, Math.min(1, (4.2 - t) / .8));
        x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        x.restore();
      });
      if(t < 4.2 && document.body.contains(c)) requestAnimationFrame(frame); else c.remove();
    };
    requestAnimationFrame(frame);
  }catch(e){}
}

        <li>🎲 Eine Uhrzeit erscheint. Sag sie laut oder denk sie dir und tippe auf die Karte. Sie dreht sich um.</li>
        <li>Die Lösung wird auf Englisch vorgelesen. Tippe auf 🔊, dann ist sie lautlos 🔇 und bleibt es, bis du wieder auf 🔇 tippst. Dann wird die Lösung gleich vorgelesen.</li>
        <li>Tippe ehrlich auf ✓ <strong>Gewusst</strong> oder ✗ <strong>Nicht gewusst</strong>.</li>
        <li>Eine Runde hat ${ROUND} Uhrzeiten. Ab 4 gewussten gibt es 🥉 Bronze und 1 ⭐, ab 8 🥈 Silber und 2 ⭐, bei 10 🥇 Gold, 3 ⭐ und Konfetti.</li>
        <li>Jede Übung hat ihre eigene Medaille. Sie kommt aus dem Durchschnitt aller Runden: 🥉 ab Ø 4, 🥈 ab Ø 8, 🥇 ab Ø 9,5. Sie kann auch wieder verloren gehen.</li>

    <section class="panel">
      <table class="cheat">${ex.map(e => `<tr><td>${e[2]}</td><td>${e[3]}</td></tr>`).join("")}</table>
      <p class="goal" style="margin-top:8px">Bis halb sagt man <strong>past</strong> und die Stunde, die gerade ist. Danach sagt man <strong>to</strong> und die nächste Stunde.</p>
    </section>
  `;
  document.getElementById("back").onclick = () => go("#start");

/* ---------- Sicherung ---------- */
function renderBackup(){
  app.innerHTML = banner() + `
    <div class="topbar"><button class="back" id="back">‹ Übungen</button></div>
    <h1>💾 Sicherung</h1>
    <p class="muted">Speichert alle Runden, Sterne und Medaillen in einer Datei. So geht nichts verloren, auch nicht bei einem neuen Handy.</p>
    <section class="panel">
      <p class="goal" style="margin-top:0">${S.lastBackup ? "Letzte Sicherung: " + new Date(S.lastBackup).toLocaleDateString("de-DE", {day:"numeric", month:"long", year:"numeric"}) : "Noch keine Sicherung gespeichert."}</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <button class="btn" id="exp">💾 Sicherung speichern</button>
        <button class="btn ghost" id="imp">📂 Sicherung laden</button>
      </div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div class="msg" id="bmsg" aria-live="polite"></div>
    </section>
  `;
  const bmsg = document.getElementById("bmsg");
  if(ui.backupMsg){ bmsg.textContent = ui.backupMsg.text; bmsg.className = "msg " + ui.backupMsg.kind; ui.backupMsg = null; }
  document.getElementById("back").onclick = () => go("#start");
  document.getElementById("exp").onclick = e => exportBackup(e.currentTarget, bmsg);
  const file = document.getElementById("impFile");
  document.getElementById("imp").onclick = () => file.click();
  file.onchange = () => { if(file.files[0]) importBackup(file.files[0], bmsg); file.value = ""; };
  window.scrollTo(0, 0);
}
async function exportBackup(btn, msg){
  const data = JSON.stringify({ app:"uhrenkiste", version:1, exported:new Date().toISOString(), data:S });
  const filename = "uhrenkiste-sicherung-" + new Date().toISOString().slice(0,10) + ".json";
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Wird vorbereitet …";
  let dl = null;
  try{ if(window.claude && typeof window.claude.use === "function") dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  try{
    if(dl){
      await dl.save({ filename, data });
    } else {
      const url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    }
    S.lastBackup = Date.now(); save();
    ui.backupMsg = { kind:"ok", text:`Sicherung „${filename}“ gespeichert. Du findest sie im Ordner „Downloads“.` };
    renderBackup();
  }catch(e){
    btn.disabled = false; btn.textContent = label;
    const code = e && e.code;
    msg.textContent = code === "declined" ? "Sicherung abgebrochen." : code === "rate_limited" ? "Bitte kurz warten und noch einmal tippen." : "Die Sicherung konnte hier nicht gespeichert werden.";
    msg.className = "msg err";
  }
}
function importBackup(file, msg){
  const r = new FileReader();
  r.onerror = () => { msg.textContent = "Die Datei konnte nicht gelesen werden."; msg.className = "msg err"; };
  r.onload = async () => {
    let d;
    try{
      const o = JSON.parse(r.result);
      d = o && o.app === "uhrenkiste" && o.data ? fix(o.data) : null;
      if(!d) throw 0;
    }catch(e){
      msg.textContent = "Das ist keine Sicherung von „What’s the time?“."; msg.className = "msg err"; return;
    }
    const rounds = MODES.reduce((a, m) => a + d.modes[m.key].scores.length, 0);
    const stars = MODES.reduce((a, m) => a + d.modes[m.key].stars, 0);
    const c = await choose("Sicherung laden", `In der Datei: ${plural(rounds, "Runde", "Runden")} und ${plural(stars, "Stern", "Sterne")}. Der Stand auf diesem Gerät wird ersetzt.`,
      [{ value:"yes", label:"Sicherung laden", primary:true }]);
    if(!c) return;
    const last = S.lastBackup;
    S = d; if(last && !S.lastBackup) S.lastBackup = last;
    save();
    ui.backupMsg = { kind:"ok", text:"Sicherung geladen." };
    renderBackup();
  };
  r.readAsText(file);
}

function choose(title, text, options){
  return new Promise(resolve => {
    dlg.innerHTML = `<form method="dialog">
      <h3>${esc(title)}</h3>
      ${text ? `<p class="muted">${esc(text)}</p>` : ""}
      <div class="dlg-actions">
        ${options.map(o => `<button class="btn ${o.primary ? "" : "ghost"}" value="${o.value}" ${o.danger ? 'style="color:var(--bad)"' : ""}>${esc(o.label)}</button>`).join("")}
        <button class="btn ghost" value="cancel">Abbrechen</button>
      </div></form>`;
    let choice = "cancel";
    dlg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { choice = b.value; }));
    dlg.onclose = () => resolve(choice === "cancel" ? null : choice);
    dlg.showModal();
  });
}

render();
})();
